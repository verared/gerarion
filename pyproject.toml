[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerarion"
version = "2.3.5"
description = "Gerarion Universal Standard (GUS v2.0): calendario regular y marca temporal verificable (existencia anclada y firmada, post-quantum by design)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "verared" },
  { name = "Gerardo Loyola" },
]
keywords = ["calendar", "timestamp", "post-quantum", "cryptography", "merkle", "time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Clock",
]

[project.urls]
Homepage = "https://github.com/verared/gerarion"
Repository = "https://github.com/verared/gerarion"

[project.scripts]
gero = "gerarion.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
slh = ["slh-dsa==0.2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
