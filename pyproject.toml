[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gerarion"
version = "2.5.0b1"
description = "Gerarion Universal Standard (GUS 2.1.0): calendario computacional y proyecto de interoperabilidad temporal y evidencias verificables; funciones de seguridad en revisión"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSES/MIT.txt", "LICENSES/Apache-2.0.txt"]
authors = [
  { name = "verared" },
  { name = "Gerardo Loyola" },
]
keywords = ["calendar", "timestamp", "post-quantum", "cryptography", "merkle", "time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Clock",
]

[project.urls]
Homepage = "https://github.com/verared/gerarion"
Repository = "https://github.com/verared/gerarion"

[project.scripts]
gero = "gerarion.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
slh = ["slh-dsa==0.2.5"]
pqc = ["cryptography>=47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
