<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Calendario universal · Gerarion</title>
    <meta
      name="description"
      content="Calendario universal Gerarion y atlas de equivalencias: traductor entre diez calendarios, reloj TCJ, intervalos e hitos. Sin cuentas ni envío de datos."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/atlas.svg#sun"
      sizes="any"
    />
    <link rel="preload" href="assets/atlas.svg" as="image" type="image/svg+xml" />
    <link
      rel="preload"
      href="fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <div id="scrim" hidden></div>
    <div class="shell">
      <header class="topbar">
        <div class="brand-row">
          <button
            id="menu-toggle"
            class="icon-button"
            aria-label="Abrir menú de navegación"
            aria-expanded="false"
            aria-controls="sidebar"
            data-action="menu"
          >
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#menu" /></svg>
          </button>
          <a class="crumb-root" href="#calendario" data-view="calendario">
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#brand" /></svg>
            Gerarion
          </a>
          <span class="crumb-divider" aria-hidden="true">/</span>
          <span class="crumb" id="crumb">Calendario</span>
        </div>
        <div class="header-tools">
          <button
            id="contrast-control"
            class="icon-button"
            data-action="contrast"
            aria-pressed="false"
            aria-label="Alternar alto contraste"
            title="Alto contraste"
          >
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#contrast" /></svg>
          </button>
          <button id="zone-trigger" class="tcj-trigger" data-action="zones">
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#globe" /></svg>
            <span class="mono" id="header-time">--:--:--</span>
            <span class="zone-label mono" id="header-zone">TCJ+0</span>
            <span id="header-city">Jerusalén</span>
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#down" /></svg>
          </button>
        </div>
      </header>
      <nav class="sidebar" id="sidebar" aria-label="Secciones del atlas">
        <div class="sidebar-head">
          <span class="mobile-brand">
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#brand" /></svg>
            Gerarion
          </span>
          <button
            class="icon-button mobile-close"
            aria-label="Cerrar menú"
            data-action="menu"
          >
            <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#x" /></svg>
          </button>
        </div>
        <p class="eyebrow sidebar-label">Atlas del tiempo</p>
        <a class="nav-item" href="#calendario" data-view="calendario">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#calendar" /></svg>
          Calendario
        </a>
        <a class="nav-item" href="#traductor" data-view="traductor">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#convert" /></svg>
          Traductor
        </a>
        <a class="nav-item" href="#reloj" data-view="reloj">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#clock" /></svg>
          Reloj en vivo
        </a>
        <a class="nav-item" href="#distancia" data-view="distancia">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#distance" /></svg>
          Distancia
        </a>
        <a class="nav-item" href="#hitos" data-view="hitos">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#book" /></svg>
          Hitos
        </a>
        <a class="nav-item" href="#referencia" data-view="referencia">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#file" /></svg>
          Referencia
        </a>
        <a class="nav-item" href="#verificacion" data-view="verificacion">
          <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#shield" /></svg>
          Verificación
        </a>
        <div class="sidebar-foot">
          <p class="eyebrow">Estado del núcleo</p>
          <p class="engine-line">
            <i class="status-dot" aria-hidden="true"></i>
            <span id="engine-status">Cálculo verificado</span>
          </p>
          <p class="fineprint">GUS 3.0.0 · TCJ+0</p>
        </div>
      </nav>
      <main class="main" id="workspace">
        <div id="view" class="page"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <p class="sr-only" role="status" id="announcement"></p>
    <footer class="footer">
      <svg class="icon" aria-hidden="true"><use href="assets/atlas.svg#sun" /></svg>
      <span>
        Gerarion · coordenadas de tiempo abiertas · consulta la
        <a href="https://github.com/verared/gerarion" target="_blank" rel="noopener noreferrer">especificación y el código</a>
      </span>
    </footer>
    <noscript>
      <p class="noscript">
        Este atlas calcula todo en tu navegador con JavaScript. Sin él no puede
        dibujar el calendario; el punto de entrada documental sigue siendo la
        especificación GUS.
      </p>
    </noscript>
  </body>
</html>
