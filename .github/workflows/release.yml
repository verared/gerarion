# Distribución 100 % independiente: GitHub Releases sin registries externos
# (sin PyPI, sin npm, sin TestPyPI). Se dispara con tags v* o manualmente.
# Publica en la Release del tag: wheel y sdist de Python, tarball del kernel
# JS (npm pack, cero dependencias), binarios C y SHA256SUMS.txt con los
# hashes de todos los artefactos.
#
# Seguridad: todas las actions ancladas al SHA upstream completo
# (mismo criterio que ci.yml y pages.yml).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Construir sdist y wheel de Python
        run: |
          python -m pip install build
          python -m build

      - name: Empaquetar kernel JS (npm pack, sin dependencias)
        run: cd web && npm pack

      - name: Compilar núcleo C y suite de conformancia
        run: make -C impl-c conformance

      - name: Empaquetar libgerarion (estática y compartida, linux x86_64)
        run: |
          make -C impl-c libgerarion.a libgerarion.so.3 gerarion.pc
          mkdir -p stage/lib stage/include/gerarion stage/lib/pkgconfig
          cp impl-c/libgerarion.a impl-c/libgerarion.so.3 stage/lib/
          cp impl-c/gus.h impl-c/china_table.h impl-c/gerarion_calendars.h \
             impl-c/gerarion.h stage/include/gerarion/
          cp impl-c/gerarion.pc stage/lib/pkgconfig/
          tar czf "libgerarion-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" -C stage .
          rm -rf stage

      - name: Generar SHA256SUMS.txt
        run: |
          sha256sum dist/gerarion-*.whl dist/gerarion-*.tar.gz web/gerarion-kernel-*.tgz \
            libgerarion-*-linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir artefactos del workflow (workflow_dispatch, sin tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gerarion-release-artifacts
          path: |
            dist/gerarion-*.whl
            dist/gerarion-*.tar.gz
            web/gerarion-kernel-*.tgz
            libgerarion-*-linux-x86_64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publicar GitHub Release (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Gerarion $GITHUB_REF_NAME" \
            --verify-tag \
            --notes "Artefactos sellados del tag \`$GITHUB_REF_NAME\` (GUS v2.0).
            Ver CHANGELOG.md para las notas de versión.
            Verificación de integridad: \`sha256sum -c SHA256SUMS.txt\` (desde una carpeta con dist/ y el tarball JS, o recorta las rutas del fichero)."
          gh release upload "$GITHUB_REF_NAME" \
            dist/gerarion-*.whl dist/gerarion-*.tar.gz \
            web/gerarion-kernel-*.tgz \
            libgerarion-*-linux-x86_64.tar.gz SHA256SUMS.txt
