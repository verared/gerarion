name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest es ya Ubuntu 26.04, donde setup-python no suministra 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pip install -e .[slh]
      - run: python -m pytest tests/ -q
      - name: Conformance JS (normative vectors)
        run: |
          node web/tests.mjs
          node web/conformance.mjs
          node web/profiles-conformance.mjs
          node web/regression-conformance.mjs
          node web/calendars.test.mjs
      - name: Conformance C (independent implementation)
        run: make -C impl-c conformance
      # 4.5(c): auditoría de dependencias (requiere red). Los hallazgos
      # afectan al toolchain de CI (pip, setuptools, urllib3…), no al kernel
      # (no publicado en PyPI: skip "Dependency not found" esperado), así que
      # se informa como ::warning sin bloquear; el reporte queda en el log.
      - name: pip-audit (informativo; los hallazgos son de toolchain de CI)
        run: |
          python -m pip install pip-audit
          python -m pip_audit || echo "::warning::pip-audit reportó hallazgos de toolchain (revisar log; no afectan al kernel)"
        continue-on-error: true
      - name: Differential fuzzing Python-JS-C
        run: |
          make -C impl-c gus-cli
          python tools/fuzz_diff.py --n 500
        # Manual runs use --n 1500 (CI keeps 500 for a ~15 min job budget);
        # the CI run is statistical coverage, the vector set is the hard proof.

  web-e2e:
    # E2E del portal web (Playwright + Chromium): sin errores JS, cero
    # peticiones externas, round-trip de enlaces compartibles, teclado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar Playwright + Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: E2E del portal (servidor estático + Chromium headless)
        run: |
          python3 -m http.server 8123 --directory web --bind 127.0.0.1 &
          SRV=$!
          sleep 2
          python3 e2e_web_test.py
          RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC
