# Publica el calculador GUS (web/) via GitHub Pages.
# Requiere: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e '.[slh]' || true
      - name: Suite Python (kernel + conformancia + fuzzing)
        run: PYTHONPATH=src python3 -m pytest tests/ -q
      - name: Suite JavaScript del kernel
        run: node --version && cd web && node test/tests.mjs
      - name: Conformancia JS contra vectores normativos
        run: cd web && node test/conformance.mjs
      - name: Conformancia C contra vectores normativos
        run: make -C impl-c conformance
      - name: Subir artifact de Pages
        if: success()
        run: |
          mkdir -p dist
          cp -R web/* dist/
          cp -R vectors dist/vectors
          rm -f dist/package.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: success()
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
