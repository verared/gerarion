# Publica el calculador GUS (web/) via GitHub Pages.
# Requiere: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . || true
      - name: Suite Python (kernel + conformancia + fuzzing)
        run: PYTHONPATH=src python3 -m pytest tests/ -q
      - name: Suite JavaScript del kernel
        run: node --version && cd web && node tests.mjs
      - name: Conformancia JS contra vectores normativos
        run: cd web && node conformance.mjs
      - name: Conformancia C contra vectores normativos
        run: make -C impl-c conformance
      - name: Subir artifact de Pages
        if: success()
        run: |
          mkdir -p dist
          cp -R web/* dist/
          cp -R vectors dist/vectors
          rm -f dist/package.json
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
