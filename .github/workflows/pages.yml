# Publica el calculador GUS (web/) via GitHub Pages.
# Requiere: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e '.[slh]' || true
      - name: Suite Python (kernel + conformancia + fuzzing)
        run: PYTHONPATH=src python3 -m pytest tests/ -q
      - name: Suite JavaScript del kernel
        run: node --version && cd web && node tests.mjs
      - name: Conformancia JS contra vectores normativos
        run: cd web && node conformance.mjs
      - name: Conformancia C contra vectores normativos
        run: make -C impl-c conformance
      - name: Subir artifact de Pages
        if: success()
        run: |
          mkdir -p dist
          cp -R web/* dist/
          cp -R vectors dist/vectors
          rm -f dist/package.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: success()
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
