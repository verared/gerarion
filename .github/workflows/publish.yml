# Publicación de releases hacia PyPI y npm con Trusted Publishing (OIDC).
# Sin secretos estáticos: se autentica con el id-token del workflow.
#
# Requisitos en los paneles web (una sola vez, por versión publicada):
# - PyPI:  manage project "gerarion" -> Publishing -> GitHub Trusted Publisher:
#     owner=verared, repository=gerarion, workflow=publish.yml, environment=pypi
# - npm:   package "gerarion-kernel" -> Settings -> Publishing access:
#     vinculaciones OIDC de GitHub Actions (gh-packages) o token granular
#     mientras el paquete aún no existe (la primera publicación de un nombre
#     nuevo en npm aún requiere npm login/token: ver comentarios del job).
#
# Seguridad: todas las actions están ancladas al SHA upstream completo
# (mismo criterio que ci.yml y pages.yml).
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Instalar build
        run: python -m pip install build
      - name: Construir sdist y wheel
        run: python -m build
      - name: Publicar en PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  publish-npm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"
      # La PRIMERA publicación de gerarion-kernel necesita autenticación clásica
      # (npm login/token granular en el registro); las siguientes pueden usar
      # granular tokens o provenance OIDC de npm (--provenance), que firma el
      # paquete con este workflow y ya no requiere token.
      - name: Publicar en npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd web
          npm publish --access public --provenance
